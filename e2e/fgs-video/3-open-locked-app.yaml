# Step 3: open the locked app; the foreground service notices and shows the cloud question.
appId: com.cloudlock.app
---
- launchApp:
    appId: ${LOCK_PKG}
    stopApp: false
- extendedWaitUntil:
    visible: "What is this cloud\\?|Identify the cloud"
    timeout: 20000
# If the fallback overlay shows first, tap through it (the challenge may replace it on its own).
- runFlow:
    when:
      visible: "Identify the cloud"
    commands:
      - tapOn:
          text: "Identify the cloud"
          optional: true
- extendedWaitUntil:
    visible: "What is this cloud\\?"
    timeout: 15000
- extendedWaitUntil:
    visible: "__pause__"
    timeout: 3000
    optional: true
